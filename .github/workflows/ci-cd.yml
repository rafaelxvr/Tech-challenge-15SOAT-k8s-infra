name: ci-cd

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: local-contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Install pinned Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.4
      - name: Verify pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(terraform version -json | jq -r '.terraform_version')" = "1.15.8"
          test "$(helm version --template '{{.Version}}')" = "v3.17.4"
      - name: Initialize deployment executor providers
        run: terraform -chdir=infra/modules/deployment-executor init -backend=false -input=false -lockfile=readonly
      - name: Verify pipeline contracts
        shell: pwsh
        run: |
          ./tests/workflow-context-contract.ps1
          ./tests/source-package-contract.ps1
          ./tests/pipeline-contract.ps1
          ./tests/release-readiness-contract.ps1
          ./tests/gateway-contract-tests.ps1
          ./tests/functions-contract.ps1
          ./tests/platform-manifests-tests.ps1
          ./tests/staging-app-workload-tests.ps1
          ./tests/staging-migration-tests.ps1
          ./tests/deployer-dependencies-tests.ps1
          ./tests/runtime-public-configmap-tests.ps1
          ./tests/application-rollout-tests.ps1
          ./tests/workload-capacity-tests.ps1
      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive
      - name: Verify staging APP IRSA with mocked AWS
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/modules/staging-app-irsa init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/modules/staging-app-irsa validate
          terraform -chdir=infra/modules/staging-app-irsa test
          terraform -chdir=infra/modules/staging-migration-irsa init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/modules/staging-migration-irsa validate
          terraform -chdir=infra/modules/staging-migration-irsa test
          terraform -chdir=infra/foundation init -backend=false -input=false
          terraform -chdir=infra/foundation validate
          terraform -chdir=infra/foundation test -filter=tests/outputs.tftest.hcl
      - name: Verify monitoring Terraform and rendered New Relic collectors
        shell: bash
        run: |
          set -euo pipefail
          command -v helm
          terraform -chdir=infra/monitoring init -backend=false
          terraform -chdir=infra/monitoring validate
          terraform -chdir=infra/monitoring test
          pwsh -NoProfile -File tests/newrelic-chart-tests.ps1

  deploy-staging:
    name: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: verify
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: phase3-k8s-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: staging
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      SOURCE_PREFIX: ${{ vars.SOURCE_PREFIX }}
      CODEBUILD_PROJECT: ${{ vars.CODEBUILD_PROJECT }}
      DEPLOYER_IMAGE_DIGEST: ${{ vars.DEPLOYER_IMAGE_DIGEST }}
      FOUNDATION_OUTPUT_RECEIPT_JSON: ${{ vars.FOUNDATION_OUTPUT_RECEIPT_JSON }}
      CLOUD_WINDOW_EVIDENCE_JSON: ${{ secrets.CLOUD_WINDOW_EVIDENCE_JSON }}
      TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate branch and event before requesting identity
        shell: pwsh
        run: ./scripts/check-workflow-context.ps1 -Environment $env:DEPLOY_ENVIRONMENT
      - name: Require reviewed environment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(ARTIFACT_BUCKET SOURCE_PREFIX CODEBUILD_PROJECT DEPLOYER_IMAGE_DIGEST FOUNDATION_OUTPUT_RECEIPT_JSON CLOUD_WINDOW_EVIDENCE_JSON TERRAFORM_TFVARS_JSON)
          for variable in "${required[@]}"; do
            test -n "${!variable:-}" || { echo "Missing reviewed environment configuration: ${variable}"; exit 1; }
          done
      - name: Assume staging launcher role with OIDC
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_LAUNCHER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: phase3-k8s-staging
      - name: Create immutable release manifest
        shell: pwsh
        run: |
          $sourceSha = ./scripts/package-source.ps1 -SourceCommit $env:GITHUB_SHA -OutputFile "$env:RUNNER_TEMP/bundle.zip"
          $manifest = [ordered]@{ schemaVersion = 1; environment = $env:DEPLOY_ENVIRONMENT; sourceCommit = $env:GITHUB_SHA; artifactSha256 = $sourceSha; deployerImageDigest = "sha256:$env:DEPLOYER_IMAGE_DIGEST"; contractVersion = 'phase3-v2'; migrationVersion = 'platform-v1'; promotedFromStaging = $false }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/release-manifest.json" -NoNewline
          "SOURCE_SHA256=$sourceSha" >> $env:GITHUB_ENV
          "MANIFEST_SHA256=$((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/release-manifest.json" -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
      - name: Launch and wait for private staging executor
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'cloud-window.json'
          $baseTfvars = Join-Path $env:RUNNER_TEMP 'terraform.tfvars.base.json'
          $foundationReceipt = Join-Path $env:RUNNER_TEMP 'foundation-output-receipt.json'
          $tfvars = Join-Path $env:RUNNER_TEMP 'terraform.tfvars.json'
          Set-Content -LiteralPath $evidence -NoNewline -Value $env:CLOUD_WINDOW_EVIDENCE_JSON
          Set-Content -LiteralPath $baseTfvars -NoNewline -Value $env:TERRAFORM_TFVARS_JSON
          Set-Content -LiteralPath $foundationReceipt -NoNewline -Value $env:FOUNDATION_OUTPUT_RECEIPT_JSON
          ./scripts/resolve-foundation-outputs.ps1 -ArtifactBucket $env:ARTIFACT_BUCKET -ReceiptFile $foundationReceipt -BaseTerraformVariablesFile $baseTfvars -OutputTerraformVariablesFile $tfvars
          ./scripts/start-deploy.ps1 -Environment staging -SourceZip "$env:RUNNER_TEMP/bundle.zip" -ExpectedSha256 $env:SOURCE_SHA256 -ReleaseManifest "$env:RUNNER_TEMP/release-manifest.json" -ExpectedManifestSha256 $env:MANIFEST_SHA256 -Bucket $env:ARTIFACT_BUCKET -SourcePrefix $env:SOURCE_PREFIX -ProjectName $env:CODEBUILD_PROJECT -DeployerImageDigest $env:DEPLOYER_IMAGE_DIGEST -SourceCommit $env:GITHUB_SHA -CloudWindowEvidenceFile $evidence -TerraformVariablesFile $tfvars -PromotionEvidenceOutputFile "$env:RUNNER_TEMP/staging-promotion-receipt.json"

  deploy-production:
    name: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: phase3-k8s-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: production
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      SOURCE_PREFIX: ${{ vars.SOURCE_PREFIX }}
      CODEBUILD_PROJECT: ${{ vars.CODEBUILD_PROJECT }}
      DEPLOYER_IMAGE_DIGEST: ${{ vars.DEPLOYER_IMAGE_DIGEST }}
      FOUNDATION_OUTPUT_RECEIPT_JSON: ${{ vars.FOUNDATION_OUTPUT_RECEIPT_JSON }}
      STAGING_PROMOTION_KEY: ${{ vars.STAGING_PROMOTION_KEY }}
      STAGING_PROMOTION_VERSION_ID: ${{ vars.STAGING_PROMOTION_VERSION_ID }}
      STAGING_PROMOTION_SHA256: ${{ vars.STAGING_PROMOTION_SHA256 }}
      CLOUD_WINDOW_EVIDENCE_JSON: ${{ secrets.CLOUD_WINDOW_EVIDENCE_JSON }}
      TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate branch and event before requesting identity
        shell: pwsh
        run: ./scripts/check-workflow-context.ps1 -Environment $env:DEPLOY_ENVIRONMENT
      - name: Require reviewed environment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(ARTIFACT_BUCKET SOURCE_PREFIX CODEBUILD_PROJECT DEPLOYER_IMAGE_DIGEST FOUNDATION_OUTPUT_RECEIPT_JSON STAGING_PROMOTION_KEY STAGING_PROMOTION_VERSION_ID STAGING_PROMOTION_SHA256 CLOUD_WINDOW_EVIDENCE_JSON TERRAFORM_TFVARS_JSON)
          for variable in "${required[@]}"; do
            test -n "${!variable:-}" || { echo "Missing reviewed environment configuration: ${variable}"; exit 1; }
          done
      - name: Assume production launcher role with OIDC
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_LAUNCHER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: phase3-k8s-production
      - name: Calculate production artifact digest
        shell: pwsh
        run: |
          $sourceSha = ./scripts/package-source.ps1 -SourceCommit $env:GITHUB_SHA -OutputFile "$env:RUNNER_TEMP/bundle.zip"
          "SOURCE_SHA256=$sourceSha" >> $env:GITHUB_ENV
      - name: Verify named successful staging release
        shell: pwsh
        run: |
          ./scripts/verify-staging-promotion.ps1 -Bucket $env:ARTIFACT_BUCKET -PromotionKey $env:STAGING_PROMOTION_KEY -PromotionVersionId $env:STAGING_PROMOTION_VERSION_ID -ExpectedPromotionSha256 $env:STAGING_PROMOTION_SHA256 -ExpectedArtifactSha256 $env:SOURCE_SHA256 -OutputFile "$env:RUNNER_TEMP/verified-staging-promotion.json"
      - name: Create promotion-bound release manifest
        shell: pwsh
        run: |
          $promotion = Get-Content -LiteralPath "$env:RUNNER_TEMP/verified-staging-promotion.json" -Raw | ConvertFrom-Json
          $manifest = [ordered]@{ schemaVersion = 1; environment = $env:DEPLOY_ENVIRONMENT; sourceCommit = $env:GITHUB_SHA; artifactSha256 = $env:SOURCE_SHA256; deployerImageDigest = "sha256:$env:DEPLOYER_IMAGE_DIGEST"; contractVersion = 'phase3-v2'; migrationVersion = 'platform-v1'; promotedFromStaging = $true; stagingManifestSha256 = $promotion.stagingManifestSha256; stagingArtifactSha256 = $promotion.stagingArtifactSha256; stagingPromotionSha256 = $promotion.promotionSha256; stagingPromotionKey = $promotion.stagingPromotionKey; stagingPromotionVersionId = $promotion.stagingPromotionVersionId }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/release-manifest.json" -NoNewline
          "MANIFEST_SHA256=$((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/release-manifest.json" -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
      - name: Launch and wait for private production executor
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'cloud-window.json'
          $baseTfvars = Join-Path $env:RUNNER_TEMP 'terraform.tfvars.base.json'
          $foundationReceipt = Join-Path $env:RUNNER_TEMP 'foundation-output-receipt.json'
          $tfvars = Join-Path $env:RUNNER_TEMP 'terraform.tfvars.json'
          Set-Content -LiteralPath $evidence -NoNewline -Value $env:CLOUD_WINDOW_EVIDENCE_JSON
          Set-Content -LiteralPath $baseTfvars -NoNewline -Value $env:TERRAFORM_TFVARS_JSON
          Set-Content -LiteralPath $foundationReceipt -NoNewline -Value $env:FOUNDATION_OUTPUT_RECEIPT_JSON
          ./scripts/resolve-foundation-outputs.ps1 -ArtifactBucket $env:ARTIFACT_BUCKET -ReceiptFile $foundationReceipt -BaseTerraformVariablesFile $baseTfvars -OutputTerraformVariablesFile $tfvars
          ./scripts/start-deploy.ps1 -Environment production -SourceZip "$env:RUNNER_TEMP/bundle.zip" -ExpectedSha256 $env:SOURCE_SHA256 -ReleaseManifest "$env:RUNNER_TEMP/release-manifest.json" -ExpectedManifestSha256 $env:MANIFEST_SHA256 -Bucket $env:ARTIFACT_BUCKET -SourcePrefix $env:SOURCE_PREFIX -ProjectName $env:CODEBUILD_PROJECT -DeployerImageDigest $env:DEPLOYER_IMAGE_DIGEST -SourceCommit $env:GITHUB_SHA -CloudWindowEvidenceFile $evidence -TerraformVariablesFile $tfvars -VerifiedPromotionFile "$env:RUNNER_TEMP/verified-staging-promotion.json"

  deploy-foundation-addons:
    name: deploy-foundation-addons
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: verify
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: phase3-foundation-addons-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      CLOUD_WINDOW_EVIDENCE_JSON: ${{ secrets.CLOUD_WINDOW_EVIDENCE_JSON }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate branch and event before requesting identity
        shell: pwsh
        run: ./scripts/check-workflow-context.ps1 -Environment staging
      - name: Require reviewed staging configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in ARTIFACT_BUCKET CLOUD_WINDOW_EVIDENCE_JSON; do
            test -n "${!variable:-}" || { echo "Missing reviewed staging configuration: ${variable}"; exit 1; }
          done
      - name: Assume existing staging launcher role with OIDC
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_LAUNCHER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: phase3-foundation-addons-staging
      - name: Package the immutable foundation-addons root
        shell: pwsh
        run: |
          git archive --format=zip --output "$env:RUNNER_TEMP/foundation-addons.zip" $env:GITHUB_SHA infra/foundation-addons
          "SOURCE_SHA256=$((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/foundation-addons.zip" -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
      - name: Upload, bind, and launch the reviewed foundation addons
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'cloud-window.json'
          Set-Content -LiteralPath $evidence -NoNewline -Value $env:CLOUD_WINDOW_EVIDENCE_JSON
          ./scripts/start-foundation-addons.ps1 -SourceZip "$env:RUNNER_TEMP/foundation-addons.zip" -ExpectedSha256 $env:SOURCE_SHA256 -Bucket $env:ARTIFACT_BUCKET -SourceCommit $env:GITHUB_SHA -CloudWindowEvidenceFile $evidence
