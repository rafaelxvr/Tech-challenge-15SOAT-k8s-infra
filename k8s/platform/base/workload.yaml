apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-app
    spec:
      serviceAccountName: oficina-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ${APP_IMAGE}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/etc/oficina/public/customer-public-keys.yaml"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-staff-jwt
                  key: staff_hmac_secret
            - name: JWT_STAFF_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: oficina-runtime-public-${ENVIRONMENT}
                  key: staff-issuer
            - name: JWT_STAFF_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: oficina-runtime-public-${ENVIRONMENT}
                  key: staff-audience
            - name: JWT_STAFF_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: oficina-runtime-public-${ENVIRONMENT}
                  key: staff-key-id
            - name: JWT_CUSTOMER_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: oficina-runtime-public-${ENVIRONMENT}
                  key: customer-issuer
            - name: JWT_CUSTOMER_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: oficina-runtime-public-${ENVIRONMENT}
                  key: customer-audience
            - name: HISTORICO_ZONA_COMPATIBILIDADE
              valueFrom:
                configMapKeyRef:
                  name: oficina-runtime-public-${ENVIRONMENT}
                  key: history-zone
            - name: OUTBOX_ENABLED
              value: "true"
            - name: OUTBOX_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: oficina-runtime-public-${ENVIRONMENT}
                  key: notification-queue-url
            - name: AWS_REGION
              value: "us-east-1"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://${DB_HOST}:5432/oficina?sslmode=verify-full&sslrootcert=/etc/oficina/public/rds-ca.pem"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oficina-runtime-secrets
                  key: db_username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-runtime-secrets
                  key: db_password
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
            # Snapshot configuration is nonsecret. The insert key remains in the CSI-synced
            # existing environment secret and never appears in Terraform values or manifests.
            - name: OBSERVABILITY_SNAPSHOTS_ENABLED
              value: "true"
            - name: DEPLOYMENT_ENVIRONMENT
              value: "${ENVIRONMENT}"
            - name: OFICINA_ENVIRONMENT
              value: "${ENVIRONMENT}"
            - name: NEW_RELIC_ACCOUNT_ID
              value: "${NEW_RELIC_ACCOUNT_ID}"
            - name: NEW_RELIC_EVENT_ENDPOINT
              value: "https://insights-collector.newrelic.com/v1/accounts/${NEW_RELIC_ACCOUNT_ID}/events"
            - name: NEW_RELIC_INSERT_KEY
              valueFrom:
                secretKeyRef:
                  name: oficina-runtime-secrets
                  key: newrelic_insert_key
            # The Java agent consumes the same existing ingest key. This is a second reference
            # to the approved CSI-synced key, never a second Secret or a plaintext value.
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: oficina-runtime-secrets
                  key: newrelic_insert_key
          startupProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: runtime-public
              mountPath: /etc/oficina/public
              readOnly: true
            - name: runtime-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-public
          configMap:
            name: oficina-runtime-public-${ENVIRONMENT}
            optional: false
            items:
              - key: customer-public-keys.yaml
                path: customer-public-keys.yaml
              - key: rds-ca.pem
                path: rds-ca.pem
        - name: runtime-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: oficina-runtime-secrets
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oficina-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficina-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina-app
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
