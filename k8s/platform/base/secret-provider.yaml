apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oficina-runtime-secrets
spec:
  provider: aws
  secretObjects:
    - secretName: oficina-runtime-secrets
      type: Opaque
      data:
        - objectName: db_username
          key: db_username
        - objectName: db_password
          key: db_password
        - objectName: newrelic_insert_key
          key: newrelic_insert_key
  parameters:
    region: us-east-1
    objects: |
      - objectName: "${APP_SECRET_ARN}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "db_username"
          - path: "password"
            objectAlias: "db_password"
      # Existing approved per-environment ingest secret. R2 only references it;
      # creation/value initialization remain outside Terraform and this workload.
      - objectName: "${NEW_RELIC_INGEST_SECRET_ARN}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "NEW_RELIC_INSERT_KEY"
            objectAlias: "newrelic_insert_key"
