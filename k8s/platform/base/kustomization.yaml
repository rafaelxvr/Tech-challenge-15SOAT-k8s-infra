apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - deployer-rbac.yaml
  - secret-provider.yaml
  - workload.yaml
  - network-policies.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: oficina
      app.kubernetes.io/managed-by: oficina-k8s-infra
    # Cross-namespace peers (CoreDNS/metrics-server) are not oficina-owned.
    # Keep APP selectors explicit instead of injecting labels into every peer.
    includeSelectors: false
    includeTemplates: true
