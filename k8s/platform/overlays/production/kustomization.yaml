apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina-production
resources:
  - namespace.yaml
  - ../../base
  - pdb.yaml
patches:
  - target:
      kind: Deployment
      name: oficina-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: oficina-app
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
  - target:
      kind: Deployment
      name: oficina-app
    patch: |-
      - op: replace
        path: /spec/strategy/rollingUpdate/maxUnavailable
        value: 1
