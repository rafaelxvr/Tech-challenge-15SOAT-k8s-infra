# The chart expects this namespaced Secret/key. CSI reads the existing environment-specific AWS
# secret and synchronizes it; no Secret value is declared in Terraform, Helm values or this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: newrelic-ingest-secret-sync
  namespace: newrelic
  annotations:
    eks.amazonaws.com/role-arn: "${secret_sync_irsa_role_arn}"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: newrelic-ingest-secret
  namespace: newrelic
spec:
  provider: aws
  secretObjects:
    - secretName: ${ingest_secret_name}
      type: Opaque
      data:
        - objectName: newrelic_license_key
          key: license-key
  parameters:
    region: us-east-1
    objects: |
      - objectName: "${ingest_secret_arn}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "NEW_RELIC_INSERT_KEY"
            objectAlias: "newrelic_license_key"
---
# Secret sync occurs only when a workload mounts the CSI volume. This bounded helper establishes
# the chart's existing Secret before collectors start; it neither forwards logs nor has credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newrelic-ingest-secret-sync
  namespace: newrelic
spec:
  replicas: 1
  selector:
    matchLabels: { app: newrelic-ingest-secret-sync }
  template:
    metadata:
      labels: { app: newrelic-ingest-secret-sync }
    spec:
      serviceAccountName: newrelic-ingest-secret-sync
      containers:
        - name: sync
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 20m, memory: 32Mi }
          volumeMounts:
            - name: ingest
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: ingest
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: newrelic-ingest-secret
